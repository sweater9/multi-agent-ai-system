<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent AI System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.processing {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        
        .status.complete {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
        
        .results-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        @media (max-width: 1024px) {
            .results-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .results-container {
                grid-template-columns: 1fr;
            }
        }
        
        .result-tab {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .result-tab:hover {
            background: #e0e0e0;
        }
        
        .result-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .result-content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        
        .result-content pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        
        .projects-list {
            margin-top: 20px;
        }
        
        .project-item {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .project-item:hover {
            background: #e0e0e0;
            transform: translateX(5px);
        }
        
        .project-name {
            font-weight: 600;
            color: #333;
        }
        
        .project-info {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .project-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 12px;
            width: auto;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Multi-Agent AI System</h1>
            <p class="subtitle">Powered by Google Gemini</p>
        </header>
        
        <div class="main-grid">
            <!-- Input Section -->
            <div class="card">
                <h2>📝 Create New Project</h2>
                
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" placeholder="e.g., water_tracker_app">
                </div>
                
                <div class="form-group">
                    <label for="userRequest">Project Description</label>
                    <textarea id="userRequest" placeholder="Describe what you want to build...

Example: Build a water intake tracker web app with React that:
- Allows users to log water consumption
- Shows daily goal progress (8 glasses/day)
- Displays weekly charts
- Has a simple, clean UI
- Works on mobile"></textarea>
                </div>
                
                <div class="status" id="status"></div>
                
                <button onclick="processRequest()" id="processBtn">
                    Start Workflow
                </button>
            </div>
            
            <!-- Recent Projects Section -->
            <div class="card">
                <h2>📂 Recent Projects</h2>
                <div id="projectsList" class="projects-list">
                    <p style="color: #999; text-align: center;">Loading projects...</p>
                </div>
            </div>
        </div>
        
        <!-- Results Section -->
        <div class="card">
            <h2>📊 Agent Outputs</h2>
            
            <div id="noResults" style="text-align: center; color: #999; padding: 20px;">
                Create a project to see agent outputs here
            </div>
            
            <div id="resultsSection" style="display: none;">
                <div class="results-container">
                    <div class="result-tab" onclick="showResult('research')">
                        🔍 Research
                    </div>
                    <div class="result-tab" onclick="showResult('analysis')">
                        📊 Analysis
                    </div>
                    <div class="result-tab" onclick="showResult('development')">
                        🏗️ Development
                    </div>
                    <div class="result-tab" onclick="showResult('coding')">
                        💻 Coding
                    </div>
                    <div class="result-tab" onclick="showResult('qa')">
                        ✅ QA
                    </div>
                </div>
                
                <div class="result-content" id="resultContent">
                    Select an agent to view results
                </div>
                
                <button onclick="downloadProject()" class="btn-small" style="margin-top: 15px; width: 100%;">
                    📥 Download All Results
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let currentProject = null;
        let currentResults = {};
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;
        }
        
        function hideStatus() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status';
        }
        
        async function processRequest() {
            const projectName = document.getElementById('projectName').value.trim() || 'project_' + new Date().toISOString().slice(0,10);
            const userRequest = document.getElementById('userRequest').value.trim();
            
            if (!userRequest) {
                showStatus('❌ Please enter a project description', 'error');
                return;
            }
            
            document.getElementById('projectName').value = projectName;
            document.getElementById('processBtn').disabled = true;
            
            showStatus('⏳ Processing... This may take a few minutes', 'processing');
            
            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ request: userRequest, project_name: projectName })
                });
                
                const data = await response.json();
                currentProject = projectName;
                
                // Poll for results
                let done = false;
                let attempts = 0;
                
                while (!done && attempts < 120) { // 2 minute timeout
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    const statusResponse = await fetch('/api/status');
                    const statusData = await statusResponse.json();
                    
                    if (statusData.status === 'complete') {
                        showStatus('✅ ' + statusData.message, 'complete');
                        loadProjectResults(projectName);
                        done = true;
                    } else if (statusData.status === 'error') {
                        showStatus('❌ ' + statusData.message, 'error');
                        done = true;
                    } else {
                        showStatus(statusData.message, 'processing');
                    }
                    
                    attempts++;
                }
                
                if (!done) {
                    showStatus('⏰ Processing is taking longer than expected. Check back in a moment.', 'processing');
                }
                
                loadProjects();
                
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            } finally {
                document.getElementById('processBtn').disabled = false;
            }
        }
        
        async function loadProjectResults(projectName) {
            try {
                const response = await fetch(`/api/results/${projectName}`);
                const data = await response.json();
                
                if (data.results) {
                    currentResults = data.results;
                    document.getElementById('noResults').style.display = 'none';
                    document.getElementById('resultsSection').style.display = 'block';
                    showResult('research');
                }
            } catch (error) {
                console.error('Error loading results:', error);
            }
        }
        
        function showResult(agent) {
            // Update active tab
            document.querySelectorAll('.result-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show content
            const content = currentResults[agent] || 'No output for this agent';
            document.getElementById('resultContent').innerHTML = `<pre>${content}</pre>`;
        }
        
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();
                
                const projectsList = document.getElementById('projectsList');
                
                if (data.projects.length === 0) {
                    projectsList.innerHTML = '<p style="color: #999; text-align: center;">No projects yet</p>';
                    return;
                }
                
                projectsList.innerHTML = data.projects.map(project => `
                    <div class="project-item" onclick="loadProjectResults('${project.name}'); currentProject = '${project.name}';">
                        <div>
                            <div class="project-name">${project.name}</div>
                            <div class="project-info">${project.agents} agents completed</div>
                        </div>
                        <div class="project-actions">
                            <button class="btn-small" onclick="downloadProject('${project.name}'); event.stopPropagation();">
                                Download
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }
        
        async function downloadProject(projectName) {
            projectName = projectName || currentProject;
            if (!projectName) return;
            
            window.location.href = `/api/download/${projectName}`;
        }
        
        // Load projects on page load
        window.addEventListener('load', loadProjects);
    </script>
</body>
</html>
