<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multi-Agent AI</title><style>:root{--bg:#0a0a0a;--bg-panel:#111111;--bg-elevated:#161616;--bg-soft:#1a1a1a;--bg-hover:#1e1e1e;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.12);--text:#ececec;--text-muted:#a0a0a0;--text-dim:#6e6e6e;--accent:#7c8cff;--accent-soft:rgba(124,140,255,0.14);--accent-strong:#9aa6ff;--success:#3ecf8e;--success-soft:rgba(62,207,142,0.12);--warning:#e8b84a;--warning-soft:rgba(232,184,74,0.12);--danger:#f07178;--danger-soft:rgba(240,113,120,0.12);--radius:14px;--radius-sm:10px;--radius-chip:999px;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,monospace;--sidebar-w:280px}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;overflow:hidden}button,input,textarea{font:inherit;color:inherit}.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;height:100dvh}.sidebar{background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}.sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--accent-strong);flex:0 0 auto}.brand-text{min-width:0}.brand-text h1{font-size:0.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-text p{color:var(--text-dim);font-size:0.72rem;margin-top:1px}.sidebar-section{padding:12px 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.sidebar-section span{font-size:0.7rem;font-weight:550;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em}.projects{flex:1;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px;min-height:0}.project{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background 0.12s,border-color 0.12s}.project:hover{background:var(--bg-hover)}.project.active{background:var(--bg-elevated);border-color:var(--border)}.project-name{font-weight:500;font-size:0.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-meta{color:var(--text-dim);font-size:0.7rem;margin-top:2px}.sidebar-foot{padding:12px 14px 14px;border-top:1px solid var(--border);color:var(--text-dim);font-size:0.72rem;display:flex;align-items:center;gap:8px}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft);flex:0 0 auto}.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}.main-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-panel);flex:0 0 auto}.main-header h2{font-size:0.92rem;font-weight:600;letter-spacing:-0.01em}.main-header .sub{color:var(--text-muted);font-size:0.78rem;margin-top:1px}.pipeline{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.step{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--radius-chip);background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:0.72rem;font-weight:500;transition:all 0.15s}.step .step-label{color:var(--text-dim);font-variant-numeric:tabular-nums}.step .step-name{color:inherit}.step.active{color:var(--warning);border-color:rgba(232,184,74,0.35);background:var(--warning-soft)}.step.done{color:var(--success);border-color:rgba(62,207,142,0.3);background:var(--success-soft)}.conversation{flex:1;overflow:auto;padding:20px 20px 12px;min-height:0}.conversation-inner{max-width:820px;margin:0 auto}.empty{text-align:center;color:var(--text-dim);padding:48px 16px;font-size:0.9rem}.empty-title{color:var(--text-muted);font-size:0.95rem;font-weight:500;margin-bottom:6px}.results-block{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.results-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-elevated)}.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0}.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--text-muted);border-radius:8px;padding:6px 10px;font-size:0.78rem;font-weight:500;cursor:pointer;transition:all 0.12s}.tab:hover{color:var(--text);background:rgba(255,255,255,0.03)}.tab.active{color:var(--text);background:var(--accent-soft);border-color:rgba(124,140,255,0.28)}.result-pane{min-height:280px;max-height:min(58vh,560px);overflow:auto;padding:18px 18px 22px;background:var(--bg-panel)}.result-pane .md{font-size:0.9rem;color:#d4d4d4;white-space:pre-wrap;word-break:break-word;font-family:var(--font);line-height:1.6}.result-pane .md code,.result-pane .md pre{font-family:var(--mono);font-size:0.8rem}.result-pane .md code{background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;padding:1px 5px}.result-pane .md pre{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;margin:10px 0}.result-pane .md pre code{background:none;border:none;padding:0}.composer-wrap{flex:0 0 auto;padding:12px 20px 18px;border-top:1px solid var(--border);background:linear-gradient(180deg,transparent,rgba(0,0,0,0.35) 30%),var(--bg)}.composer{max-width:820px;margin:0 auto;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 12px 10px}.composer-row{display:grid;grid-template-columns:160px 1fr;gap:8px;margin-bottom:8px}@media (max-width:640px){.composer-row{grid-template-columns:1fr}}.field label{display:block;font-size:0.7rem;font-weight:500;color:var(--text-dim);margin-bottom:5px;letter-spacing:0.01em}.field input,.field textarea{width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;outline:none;transition:border-color 0.15s,box-shadow 0.15s}.field textarea{min-height:88px;resize:vertical;line-height:1.55}.field input::placeholder,.field textarea::placeholder{color:var(--text-dim)}.field input:focus,.field textarea:focus{border-color:rgba(124,140,255,0.45);box-shadow:0 0 0 3px var(--accent-soft)}.status{display:none;margin:8px 0 4px;padding:9px 11px;border-radius:var(--radius-sm);font-size:0.82rem;border:1px solid transparent}.status.show{display:flex;align-items:flex-start;gap:10px}.status.processing{background:var(--warning-soft);color:#f0c96a;border-color:rgba(232,184,74,0.22)}.status.complete{background:var(--success-soft);color:#6ee7b0;border-color:rgba(62,207,142,0.22)}.status.error{background:var(--danger-soft);color:#f5a0a6;border-color:rgba(240,113,120,0.22)}.spinner{width:14px;height:14px;border:2px solid rgba(240,201,106,0.25);border-top-color:#f0c96a;border-radius:50%;animation:spin 0.8s linear infinite;flex:0 0 auto;margin-top:2px}@keyframes spin{to{transform:rotate(360deg)}}.composer-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.hint{color:var(--text-dim);font-size:0.72rem}.btn{appearance:none;border:none;border-radius:10px;padding:9px 14px;font-weight:550;font-size:0.84rem;cursor:pointer;transition:opacity 0.12s,background 0.12s,border-color 0.12s,color 0.12s}.btn:disabled{opacity:0.5;cursor:not-allowed}.btn-primary{color:#0a0a0a;background:var(--accent-strong);box-shadow:0 1px 0 rgba(255,255,255,0.12) inset}.btn-primary:hover:not(:disabled){background:#aeb6ff}.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:6px 10px;font-size:0.76rem;border-radius:8px;font-weight:500}.btn-ghost:hover{color:var(--text);border-color:var(--border-strong);background:rgba(255,255,255,0.03)}.project .btn-ghost{opacity:0;pointer-events:none;padding:4px 8px;font-size:0.7rem}.project:hover .btn-ghost,.project.active .btn-ghost{opacity:1;pointer-events:auto}@media (max-width:860px){body{overflow:auto}.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh;min-height:100dvh}.sidebar{border-right:none;border-bottom:1px solid var(--border);max-height:260px}.projects{max-height:160px}.main{min-height:70vh}.main-header{flex-direction:column;align-items:flex-start}.pipeline{justify-content:flex-start}.result-pane{max-height:420px}.project .btn-ghost{opacity:1;pointer-events:auto}}</style></head><body><div class="app"><aside class="sidebar"><div class="sidebar-head"><div class="brand"><div class="brand-mark">MA</div><div class="brand-text"><h1>Multi-Agent AI</h1><p>5-agent workflow</p></div></div></div><div class="sidebar-section"><span>Projects</span><button class="btn btn-ghost" onclick="loadProjects()">Refresh</button></div><div id="projectsList" class="projects"><div class="empty">Loading projects…</div></div><div class="sidebar-foot"><span class="live-dot" aria-hidden="true"></span><span>Gemini workflow live</span></div></aside><main class="main"><header class="main-header"><div><h2>Agent workspace</h2><div class="sub" id="activeProjectLabel">Start a project below</div></div><div class="pipeline" id="pipeline" aria-label="Pipeline progress"><div class="step" data-step="research"><span class="step-label">01</span><span class="step-name">Research</span></div><div class="step" data-step="analysis"><span class="step-label">02</span><span class="step-name">Analysis</span></div><div class="step" data-step="development"><span class="step-label">03</span><span class="step-name">Development</span></div><div class="step" data-step="coding"><span class="step-label">04</span><span class="step-name">Coding</span></div><div class="step" data-step="qa"><span class="step-label">05</span><span class="step-name">QA</span></div></div></header><div class="conversation"><div class="conversation-inner"><div id="noResults" class="empty"><div class="empty-title">No outputs yet</div>Run a project to see agent outputs here.</div><div id="resultsSection" style="display:none"><div class="results-block"><div class="results-toolbar"><div class="tabs" id="resultTabs"><button class="tab" data-agent="research" onclick="showResult('research', this)">Research</button><button class="tab" data-agent="analysis" onclick="showResult('analysis', this)">Analysis</button><button class="tab" data-agent="development" onclick="showResult('development', this)">Development</button><button class="tab" data-agent="coding" onclick="showResult('coding', this)">Coding</button><button class="tab" data-agent="qa" onclick="showResult('qa', this)">QA</button></div><button class="btn btn-ghost" onclick="downloadProject()">Download ZIP</button></div><div class="result-pane"><div class="md" id="resultContent">Select an agent</div></div></div></div></div></div><div class="composer-wrap"><div class="composer"><div class="composer-row"><div class="field"><label for="projectName">Project name</label><input type="text" id="projectName" placeholder="e.g. water-tracker" autocomplete="off"></div><div class="field" style="grid-column: 1 / -1"><label for="userRequest">What should the agents build?</label><textarea id="userRequest" placeholder="Describe the product, constraints, stack, and success criteria…"></textarea></div></div><div class="status" id="status"></div><div class="composer-actions"><p class="hint">Runs take a couple of minutes.</p><button class="btn btn-primary" id="processBtn" onclick="processRequest()">Run workflow</button></div></div></div></main></div><script>
let currentProject = null;
let currentResults = {};
const AGENT_ORDER = ['research', 'analysis', 'development', 'coding', 'qa'];
function escapeHtml(str) {
return String(str)
.replace(/&/g, '&')
.replace(/</g, '<')
.replace(/>/g, '>');
}
function formatMarkdownLite(text) {
const escaped = escapeHtml(text || '');
return escaped
.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
.replace(/^### (.*)$/gm, '<strong>$1</strong>')
.replace(/^## (.*)$/gm, '<strong style="font-size:1.05em">$1</strong>')
.replace(/^# (.*)$/gm, '<strong style="font-size:1.15em">$1</strong>')
.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
.replace(/`([^`]+)`/g, '<code>$1</code>');
}
function showStatus(message, type) {
const el = document.getElementById('status');
const spinning = type === 'processing'
? '<span class="spinner" aria-hidden="true"></span>'
: '';
el.innerHTML = spinning + `<span></span>`;
el.querySelector('span:last-child').textContent = String(message || '').replace(/^[⏳❌✅]\s*/, '');
el.className = `status show ${type}`;
}
function resetPipeline() {
document.querySelectorAll('.step').forEach(step => {
step.classList.remove('active', 'done');
});
}
function updatePipelineFromMessage(message) {
const lower = (message || '').toLowerCase();
let active = null;
for (const agent of AGENT_ORDER) {
if (lower.includes(agent)) {
active = agent;
break;
}
}
document.querySelectorAll('.step').forEach(step => {
const name = step.dataset.step;
step.classList.remove('active', 'done');
if (!active) return;
const idx = AGENT_ORDER.indexOf(name);
const activeIdx = AGENT_ORDER.indexOf(active);
if (idx < activeIdx) step.classList.add('done');
if (idx === activeIdx) step.classList.add('active');
});
}
function markPipelineComplete() {
document.querySelectorAll('.step').forEach(step => {
step.classList.remove('active');
step.classList.add('done');
});
}
async function processRequest() {
const projectName = document.getElementById('projectName').value.trim()
|| ('project_' + new Date().toISOString().slice(0, 10).replace(/-/g, ''));
const userRequest = document.getElementById('userRequest').value.trim();
if (!userRequest) {
showStatus('Please enter a project description.', 'error');
return;
}
document.getElementById('projectName').value = projectName;
document.getElementById('processBtn').disabled = true;
resetPipeline();
showStatus('Starting workflow…', 'processing');
try {
const response = await fetch('/api/process', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ request: userRequest, project_name: projectName })
});
const data = await response.json();
if (!response.ok) throw new Error(data.error || 'Request failed');
currentProject = projectName;
document.getElementById('activeProjectLabel').textContent = projectName;
let done = false;
let attempts = 0;
while (!done && attempts < 180) {
await new Promise(r => setTimeout(r, 2000));
const statusResponse = await fetch('/api/status');
const statusData = await statusResponse.json();
if (statusData.status === 'complete') {
showStatus(statusData.message || 'Workflow complete', 'complete');
markPipelineComplete();
await loadProjectResults(projectName);
done = true;
} else if (statusData.status === 'error') {
showStatus(statusData.message || 'Workflow failed', 'error');
done = true;
} else {
updatePipelineFromMessage(statusData.message || '');
showStatus(statusData.message || 'Processing…', 'processing');
}
attempts += 1;
}
if (!done) {
showStatus('Still running — refresh projects shortly.', 'processing');
}
await loadProjects();
} catch (error) {
showStatus(error.message, 'error');
} finally {
document.getElementById('processBtn').disabled = false;
}
}
async function loadProjectResults(projectName) {
try {
const response = await fetch(`/api/results/${encodeURIComponent(projectName)}`);
const data = await response.json();
if (!data.results) return;
currentProject = projectName;
currentResults = data.results;
document.getElementById('activeProjectLabel').textContent = projectName;
document.getElementById('noResults').style.display = 'none';
document.getElementById('resultsSection').style.display = 'block';
document.querySelectorAll('.project').forEach(el => {
el.classList.toggle('active', el.dataset.name === projectName);
});
const firstTab = document.querySelector('.tab[data-agent="research"]');
showResult('research', firstTab);
} catch (error) {
console.error('Error loading results:', error);
}
}
function showResult(agent, tabEl) {
document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
if (tabEl) tabEl.classList.add('active');
const content = currentResults[agent] || 'No output for this agent yet.';
document.getElementById('resultContent').innerHTML = formatMarkdownLite(content);
}
async function loadProjects() {
try {
const response = await fetch('/api/projects');
const data = await response.json();
const list = document.getElementById('projectsList');
if (!data.projects || data.projects.length === 0) {
list.innerHTML = '<div class="empty">No projects yet. Run your first workflow.</div>';
return;
}
list.innerHTML = data.projects.map(project => `
<div class="project ${project.name === currentProject ? 'active' : ''}" data-name="${escapeHtml(project.name)}">
<div style="min-width:0">
<div class="project-name">${escapeHtml(project.name)}</div>
<div class="project-meta">${project.agents} agent outputs</div>
</div>
<button class="btn btn-ghost" type="button">Open</button>
</div>
`).join('');
list.querySelectorAll('.project').forEach(el => {
el.addEventListener('click', () => loadProjectResults(el.dataset.name));
});
} catch (error) {
console.error('Error loading projects:', error);
document.getElementById('projectsList').innerHTML = '<div class="empty">Could not load projects.</div>';
}
}
function downloadProject(projectName) {
projectName = projectName || currentProject;
if (!projectName) return;
window.location.href = `/api/download/${encodeURIComponent(projectName)}`;
}
window.addEventListener('load', loadProjects);
</script></body></html>
